<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loans — Financial Operating System</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="nav">
      <div class="brand">Ledger</div>
      <a href="index.html">Dashboard</a>
      <a href="members.html">Members</a>
      <a href="contributions.html">Contributions</a>
      <a href="payments.html">Payments</a>
      <a href="loans.html" class="active">Loans</a>
      <a href="reconcile.html">Bank / M-Pesa</a>
      <a href="statement.html">Member Statements</a>
      <a href="reports.html">Reports</a>
      <a href="periods.html">Accounting Periods</a>
      <a href="#" onclick="signOut()">Sign out</a>
    </nav>
    <main class="main">
      <h1>Loans</h1>

      <div class="card">
        <h2>New loan application</h2>
        <div class="field"><label>Member</label><select id="a-member" onchange="checkEligibility()"></select></div>
        <div class="field"><label>Loan product</label><select id="a-product" onchange="checkEligibility()"></select></div>
        <div id="elig-box" style="background:#F3EBD8;border-radius:3px;padding:12px;margin-bottom:12px;font-size:13px;display:none"></div>
        <div class="field"><label>Principal requested (KES)</label><input id="a-principal" type="number"></div>
        <div class="field"><label>Term (months)</label><input id="a-term" type="number" value="12"></div>
        <button class="btn accent" onclick="createApplication()">Create application</button>
        <p id="app-error" class="error" style="display:none"></p>
        <p id="app-success" style="display:none;color:var(--color-success)"></p>
      </div>

      <div class="card">
        <h2>Loans</h2>
        <table>
          <thead><tr><th>Member</th><th>Product</th><th class="num">Principal</th><th>Term</th><th>Status</th><th></th></tr></thead>
          <tbody id="loan-rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
        </table>
        <p id="loan-error" class="error" style="display:none"></p>
      </div>

      <div class="card" id="detail-card" style="display:none">
        <h2 id="detail-title">Loan detail</h2>
        <div id="detail-body"></div>
      </div>

      <div class="card">
        <h2>Loan products</h2>
        <table>
          <thead><tr><th>Name</th><th class="num">Multiplier</th><th>Interest</th><th class="num">Rate %</th></tr></thead>
          <tbody id="product-rows"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
        </table>
        <details style="margin-top:12px">
          <summary style="cursor:pointer;color:var(--color-muted)">Add a loan product</summary>
          <div style="margin-top:12px">
            <div class="field"><label>Name</label><input id="pr-name"></div>
            <div class="field"><label>Savings multiplier (max loan = multiplier x deposits)</label><input id="pr-mult" type="number" value="3"></div>
            <div class="field"><label>Interest method</label>
              <select id="pr-method"><option value="reducing">Reducing balance</option><option value="flat">Flat</option></select>
            </div>
            <div class="field"><label>Annual interest rate %</label><input id="pr-rate" type="number" value="12"></div>
            <div class="field"><label>Max term (months)</label><input id="pr-term" type="number" value="12"></div>
            <div class="field"><label>Loan receivable account</label><select id="pr-recv"></select></div>
            <div class="field"><label>Interest income account</label><select id="pr-int"></select></div>
            <button class="btn accent" onclick="createProduct()">Save product</button>
            <p id="pr-error" class="error" style="display:none"></p>
          </div>
        </details>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let orgId, products = [], cashAccounts = [];

    async function loadMembers() {
      const { data } = await supabaseClient.from("members")
        .select("id, member_number, full_name").eq("organisation_id", orgId).eq("status","active").order("full_name");
      document.getElementById("a-member").innerHTML =
        (data||[]).map(m => `<option value="${m.id}">${m.member_number} — ${m.full_name}</option>`).join("");
    }

    async function loadAccounts() {
      const { data } = await supabaseClient.from("chart_of_accounts")
        .select("id, code, name, account_type").eq("organisation_id", orgId).eq("is_active", true).order("code");
      cashAccounts = (data||[]).filter(a => a.account_type === "asset" && a.code >= "1000" && a.code <= "1099");
      const all = (data||[]).map(a => `<option value="${a.id}">${a.code} — ${a.name}</option>`).join("");
      document.getElementById("pr-recv").innerHTML = all;
      document.getElementById("pr-int").innerHTML = all;
    }

    async function loadProducts() {
      const { data } = await supabaseClient.from("loan_products")
        .select("id, name, savings_multiplier, interest_method, annual_interest_rate")
        .eq("organisation_id", orgId).eq("active", true).order("name");
      products = data || [];
      document.getElementById("product-rows").innerHTML = products.length
        ? products.map(p => `<tr><td>${p.name}</td><td class="num">${p.savings_multiplier}</td><td>${p.interest_method}</td><td class="num">${p.annual_interest_rate}</td></tr>`).join("")
        : `<tr><td colspan="4" class="empty">No products yet — add one below.</td></tr>`;
      document.getElementById("a-product").innerHTML =
        products.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
      checkEligibility();
    }

    async function checkEligibility() {
      const memberId = document.getElementById("a-member").value;
      const productId = document.getElementById("a-product").value;
      const box = document.getElementById("elig-box");
      if (!memberId || !productId) { box.style.display = "none"; return; }
      const { data, error } = await supabaseClient.rpc("fn_loan_eligibility", {
        p_member_id: memberId, p_product_id: productId,
      });
      if (error) { box.style.display = "none"; return; }
      box.style.display = "block";
      box.innerHTML = `Savings: <strong>KES ${money(data.savings)}</strong> &times; ${data.savings_multiplier}
        &nbsp;|&nbsp; Existing outstanding: KES ${money(data.existing_outstanding)}
        &nbsp;|&nbsp; <strong>Maximum eligible: KES ${money(data.max_eligible)}</strong>`;
    }

    async function createApplication() {
      const errorEl = document.getElementById("app-error");
      const successEl = document.getElementById("app-success");
      errorEl.style.display="none"; successEl.style.display="none";
      const productId = document.getElementById("a-product").value;
      const prod = products.find(p => p.id === productId);
      const payload = {
        organisation_id: orgId,
        member_id: document.getElementById("a-member").value,
        product_id: productId,
        principal: document.getElementById("a-principal").value,
        term_months: document.getElementById("a-term").value,
        interest_method: prod.interest_method,
        annual_interest_rate: prod.annual_interest_rate,
        status: "pending_approval",
      };
      if (!payload.principal || Number(payload.principal) <= 0) { showError(errorEl, "Enter a principal amount."); return; }
      const { error } = await supabaseClient.from("loans").insert(payload);
      if (error) { showError(errorEl, error.message); return; }
      successEl.textContent = "Application created. Add guarantors, then approve & disburse below.";
      successEl.style.display = "block";
      document.getElementById("a-principal").value = "";
      loadLoans();
    }

    async function loadLoans() {
      const { data, error } = await supabaseClient.from("loans")
        .select("id, principal, term_months, status, members(full_name), loan_products(name)")
        .eq("organisation_id", orgId).order("created_at", { ascending: false });
      const tbody = document.getElementById("loan-rows");
      if (error) { tbody.innerHTML = `<tr><td colspan="6" class="error">${error.message}</td></tr>`; return; }
      if (!data.length) { tbody.innerHTML = `<tr><td colspan="6" class="empty">No loans yet.</td></tr>`; return; }
      tbody.innerHTML = data.map(l => `
        <tr>
          <td>${l.members.full_name}</td>
          <td>${l.loan_products.name}</td>
          <td class="num">${money(l.principal)}</td>
          <td>${l.term_months}m</td>
          <td><span class="status ${l.status==='closed'?'paid':l.status==='active'||l.status==='disbursed'?'partial':'unpaid'}">${l.status}</span></td>
          <td><button class="btn" onclick="openLoan('${l.id}')">Open</button></td>
        </tr>`).join("");
    }

    async function openLoan(loanId) {
      const card = document.getElementById("detail-card");
      const body = document.getElementById("detail-body");
      card.style.display = "block";
      body.innerHTML = "Loading…";
      card.scrollIntoView({ behavior: "smooth" });

      const { data: loan } = await supabaseClient.from("loans")
        .select("*, members(full_name), loan_products(name, interest_method, annual_interest_rate)")
        .eq("id", loanId).single();

      const { data: guarantors } = await supabaseClient.from("loan_guarantors")
        .select("id, amount_guaranteed, members:guarantor_member_id(full_name)").eq("loan_id", loanId);

      const { data: schedule } = await supabaseClient.from("loan_schedule")
        .select("installment_no, due_date, principal_due, interest_due, total_due, principal_paid, interest_paid, status")
        .eq("loan_id", loanId).order("installment_no");

      const { data: members } = await supabaseClient.from("members")
        .select("id, member_number, full_name").eq("organisation_id", orgId).eq("status","active").order("full_name");

      const totalGuaranteed = (guarantors||[]).reduce((s,g)=>s+Number(g.amount_guaranteed),0);

      let html = `<p><strong>${loan.members.full_name}</strong> — ${loan.loan_products.name} — KES ${money(loan.principal)} over ${loan.term_months} months (${loan.status})</p>`;

      // Guarantors
      html += `<h3>Guarantors (total KES ${money(totalGuaranteed)} of ${money(loan.principal)} required)</h3>`;
      html += `<table><tbody>` + ((guarantors||[]).length
        ? guarantors.map(g => `<tr><td>${g.members.full_name}</td><td class="num">${money(g.amount_guaranteed)}</td></tr>`).join("")
        : `<tr><td class="empty">None yet.</td></tr>`) + `</tbody></table>`;

      if (loan.status === 'pending_approval' || loan.status === 'draft') {
        html += `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div class="field" style="margin-bottom:0"><label>Add guarantor</label>
            <select id="g-member">${(members||[]).map(m=>`<option value="${m.id}">${m.full_name}</option>`).join("")}</select></div>
          <div class="field" style="margin-bottom:0"><label>Amount</label><input id="g-amount" type="number"></div>
          <button class="btn" onclick="addGuarantor('${loanId}')">Add</button>
        </div>`;
      }

      // Schedule
      if ((schedule||[]).length) {
        html += `<h3 style="margin-top:16px">Repayment schedule</h3>
          <table><thead><tr><th>#</th><th>Due</th><th class="num">Principal</th><th class="num">Interest</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>`;
        html += schedule.map(s => `<tr>
          <td>${s.installment_no}</td><td>${s.due_date}</td>
          <td class="num">${money(s.principal_due)}</td><td class="num">${money(s.interest_due)}</td>
          <td class="num">${money(s.total_due)}</td>
          <td><span class="status ${s.status==='paid'?'paid':s.status==='partial'?'partial':'unpaid'}">${s.status}</span></td>
        </tr>`).join("");
        html += `</tbody></table>`;
      }

      const cashOpts = cashAccounts.map(a=>`<option value="${a.id}">${a.code} — ${a.name}</option>`).join("");

      // Actions
      if (loan.status === 'pending_approval' || loan.status === 'draft') {
        html += `<div style="margin-top:16px">
          <div class="field" style="max-width:280px"><label>Disburse from account</label><select id="disburse-acct">${cashOpts}</select></div>
          <button class="btn accent" onclick="approveDisburse('${loanId}')">Approve &amp; disburse</button>
        </div>`;
      } else if (loan.status === 'active' || loan.status === 'disbursed') {
        html += `<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div class="field" style="margin-bottom:0"><label>Repayment amount</label><input id="rp-amount" type="number"></div>
          <div class="field" style="margin-bottom:0"><label>Channel</label>
            <select id="rp-channel"><option value="mpesa">M-Pesa</option><option value="bank">Bank</option><option value="cash">Cash</option></select></div>
          <div class="field" style="margin-bottom:0"><label>Into account</label><select id="rp-acct">${cashOpts}</select></div>
          <div class="field" style="margin-bottom:0"><label>Reference</label><input id="rp-ref"></div>
          <button class="btn accent" onclick="recordRepayment('${loanId}')">Record repayment</button>
        </div>`;
      }

      html += `<p id="detail-error" class="error" style="display:none"></p>`;
      body.innerHTML = html;
    }

    async function addGuarantor(loanId) {
      const errorEl = document.getElementById("detail-error");
      const { error } = await supabaseClient.from("loan_guarantors").insert({
        loan_id: loanId, organisation_id: orgId,
        guarantor_member_id: document.getElementById("g-member").value,
        amount_guaranteed: document.getElementById("g-amount").value,
      });
      if (error) { showError(errorEl, error.message); return; }
      openLoan(loanId);
    }

    async function approveDisburse(loanId) {
      const errorEl = document.getElementById("detail-error");
      if (!confirm("Approve and disburse this loan? This posts the disbursement and builds the repayment schedule.")) return;
      const { error } = await supabaseClient.rpc("fn_approve_and_disburse_loan", {
        p_loan_id: loanId, p_cash_account_id: document.getElementById("disburse-acct").value,
      });
      if (error) { showError(errorEl, error.message); return; }
      loadLoans(); openLoan(loanId);
    }

    async function recordRepayment(loanId) {
      const errorEl = document.getElementById("detail-error");
      const { error } = await supabaseClient.rpc("fn_record_loan_repayment", {
        p_loan_id: loanId,
        p_amount: document.getElementById("rp-amount").value,
        p_channel: document.getElementById("rp-channel").value,
        p_reference: document.getElementById("rp-ref").value || null,
        p_cash_account_id: document.getElementById("rp-acct").value,
      });
      if (error) { showError(errorEl, error.message); return; }
      loadLoans(); openLoan(loanId);
    }

    async function createProduct() {
      const errorEl = document.getElementById("pr-error");
      const payload = {
        organisation_id: orgId,
        name: document.getElementById("pr-name").value.trim(),
        savings_multiplier: document.getElementById("pr-mult").value,
        interest_method: document.getElementById("pr-method").value,
        annual_interest_rate: document.getElementById("pr-rate").value,
        max_term_months: document.getElementById("pr-term").value,
        savings_category: "share_deposit",
        loan_receivable_account_id: document.getElementById("pr-recv").value,
        interest_income_account_id: document.getElementById("pr-int").value,
      };
      if (!payload.name) { showError(errorEl, "Name is required."); return; }
      const { error } = await supabaseClient.from("loan_products").insert(payload);
      if (error) { showError(errorEl, error.message); return; }
      loadProducts();
    }

    (async () => {
      const session = await requireSession();
      if (!session) return;
      const org = await currentOrg();
      if (!org) return;
      orgId = org.organisation_id;
      await loadAccounts();
      await Promise.all([loadMembers(), loadProducts()]);
      loadLoans();
    })();
  </script>
</body>
</html>
