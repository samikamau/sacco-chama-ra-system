<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Organisation — Financial Operating System</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="nav" id="nav-mount"></nav>
    <main class="main">
      <h1>Create a new organisation</h1>
      <p style="color:var(--color-muted);font-size:13px;max-width:520px">
        This creates a completely separate organisation with its own members, loans,
        contributions, and users. Nothing from your current organisation carries over.
        You'll be its administrator and can switch between organisations at any time
        from the sidebar.
      </p>

      <div class="card" style="max-width:480px">
        <div class="field"><label>Organisation name *</label><input id="c-name" placeholder="e.g. Amani Chama Group"></div>
        <div class="field"><label>Organisation type *</label>
          <select id="c-type">
            <option value="sacco">SACCO</option>
            <option value="chama">Chama</option>
            <option value="residents_association">Residents Association</option>
          </select>
        </div>
        <div class="field"><label>Currency</label>
          <select id="c-currency">
            <option value="KES">KES — Kenyan Shilling</option>
            <option value="USD">USD — US Dollar</option>
            <option value="UGX">UGX — Ugandan Shilling</option>
            <option value="TZS">TZS — Tanzanian Shilling</option>
          </select>
        </div>
        <button class="btn accent" onclick="createOrganisation()">Create organisation</button>
        <p id="create-error" class="error" style="display:none"></p>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function createOrganisation() {
      const errorEl = document.getElementById("create-error");
      errorEl.style.display = "none";
      const name = document.getElementById("c-name").value.trim();
      const orgType = document.getElementById("c-type").value;
      const currency = document.getElementById("c-currency").value;
      if (!name) { showError(errorEl, "Organisation name is required."); return; }

      const { data: newOrgId, error } = await supabaseClient.rpc("fn_create_organisation", {
        p_name: name, p_org_type: orgType, p_currency: currency,
      });
      if (error) { showError(errorEl, error.message); return; }

      switchOrg(newOrgId);
    }

    (async () => {
      const session = await requireSession();
      if (!session) return;
    })();
  </script>

</body>
</html>
