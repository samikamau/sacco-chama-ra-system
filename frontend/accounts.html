<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chart of Accounts — Financial Operating System</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .coa-row { display:grid; grid-template-columns:90px 1fr 90px 90px 150px; gap:8px; align-items:center; padding:7px 16px; border-bottom:1px solid var(--color-line); font-size:13px; }
  .coa-row:last-child { border-bottom:none; }
  .coa-row:hover { background:var(--color-bg); }
  .coa-hdr { background:#F3EBD8; font-weight:600; font-size:12px; color:var(--color-muted); position:sticky; top:0; z-index:1; }
  .coa-inactive { opacity:0.45; }
  .coa-inactive .coa-name { text-decoration:line-through; }
  .drawer-backdrop { position:fixed;inset:0;background:rgba(0,0,0,0.35);display:none;z-index:40; }
  .drawer-backdrop.open { display:block; }
  .drawer { position:fixed;top:0;right:0;height:100vh;width:420px;max-width:94vw;background:var(--color-surface);z-index:50;transform:translateX(100%);transition:transform 0.2s;overflow-y:auto;padding:var(--space-4);box-shadow:-2px 0 16px rgba(0,0,0,0.12); }
  .drawer.open { transform:translateX(0); }
</style>
</head>
<body>
  <div class="app-shell">
    <nav class="nav" id="nav-mount"></nav>
    <main class="main">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h1>Chart of Accounts</h1>
        <button class="btn accent" onclick="openDrawer(null)">+ Add account</button>
      </div>

      <div class="card" style="padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <input id="f-search" placeholder="Search code or name…" oninput="renderAll()" style="flex:1;min-width:180px">
        <select id="f-status" onchange="renderAll()">
          <option value="active">Active only</option>
          <option value="all">All (including inactive)</option>
        </select>
      </div>

      <div id="coa-container" style="max-height:70vh;overflow-y:auto;padding-right:4px"></div>
    </main>
  </div>

  <!-- ADD / EDIT DRAWER -->
  <div class="drawer-backdrop" id="backdrop" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <h2 id="drawer-title">Add account</h2>
    <div class="field"><label>Account code *</label><input id="d-code"></div>
    <div class="field"><label>Account name *</label><input id="d-name"></div>
    <div class="field"><label>Category (parent) *</label>
      <select id="d-parent" onchange="autoSetType()">
        <option value="">— top level —</option>
      </select>
    </div>
    <div class="field"><label>Account type</label>
      <select id="d-type">
        <option value="asset">Asset</option>
        <option value="liability">Liability</option>
        <option value="equity">Equity</option>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
    </div>
    <div class="field"><label>Normal balance</label>
      <select id="d-normal"><option value="debit">Debit</option><option value="credit">Credit</option></select>
    </div>
    <div class="field"><label>Description (optional)</label><input id="d-desc"></div>
    <div class="field" id="d-rental-wrap">
      <label><input type="checkbox" id="d-rental"> Report on the rental schedule</label>
      <div style="font-size:12px;color:var(--color-muted);margin-top:2px">
        Income and costs tagged this way are reported on their own rental schedule.
        Only the net result appears in the main income and expenditure statement.
        Changing this applies the same setting to every sub-account beneath it.
      </div>
    </div>
    <div class="field" id="d-active-wrap" style="display:none">
      <label><input type="checkbox" id="d-active" checked> Active</label>
    </div>
    <p id="drawer-error" class="error" style="display:none"></p>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn accent" onclick="saveAccount()">Save</button>
      <button class="btn" style="background:var(--color-muted)" onclick="closeDrawer()">Cancel</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let orgId, allAccounts = [], editingId = null;

    const CATEGORIES = [
      { code:'1000', label:'Bank',               type:'asset' },
      { code:'1100', label:'Member Receivables', type:'asset' },
      { code:'1200', label:'Investments',        type:'asset' },
      { code:'1300', label:'Fixed Assets',       type:'asset' },
      { code:'2000', label:'Liabilities',        type:'liability' },
      { code:'3000', label:'Member Funds',       type:'equity' },
      { code:'4000', label:'Contributions',      type:'income' },
      { code:'5000', label:'Income',             type:'income' },
      { code:'6000', label:'Expenses',           type:'expense' },
    ];

    async function loadAccounts() {
      const { data, error } = await supabaseClient
        .from('chart_of_accounts')
        .select('id,code,name,account_type,subtype,is_control,is_active,is_payment_account,normal_balance,parent_account_id,description,in_rental_schedule')
        .eq('organisation_id', orgId)
        .order('code');
      if (error) { document.getElementById('coa-container').innerHTML = `<p class="error">${error.message}</p>`; return; }
      allAccounts = data || [];
      renderAll();
    }

    function renderAll() {
      const search = document.getElementById('f-search').value.toLowerCase();
      const showAll = document.getElementById('f-status').value === 'all';
      const container = document.getElementById('coa-container');

      // Populate parent selector in drawer. A sub-account may itself be a
      // parent, so categories and their sub-accounts are both selectable,
      // giving three levels: category -> sub -> sub-sub.
      let parentOptions = '<option value="">— top level —</option>';
      CATEGORIES.forEach(cat => {
        const catAcct = allAccounts.find(x => x.code === cat.code);
        if (!catAcct) return;
        parentOptions += `<option value="${catAcct.id}">${cat.code} — ${cat.label}</option>`;
        allAccounts
          .filter(a => a.parent_account_id === catAcct.id && a.is_active !== false)
          .forEach(sub => {
            parentOptions += `<option value="${sub.id}">&nbsp;&nbsp;&nbsp;&nbsp;${sub.code} — ${sub.name}</option>`;
          });
      });
      document.getElementById('d-parent').innerHTML = parentOptions;

      const sections = CATEGORIES.map(cat => {
        const catAcct = allAccounts.find(a => a.code === cat.code);
        if (!catAcct) return '';

        // An account stays visible if it matches the search itself or if any
        // account beneath it does, so searching for a third-level account
        // still surfaces it under its parents.
        const selfMatches = a =>
          a.code.toLowerCase().includes(search) || a.name.toLowerCase().includes(search);
        const matchesDeep = a =>
          selfMatches(a) || allAccounts.some(k => k.parent_account_id === a.id && matchesDeep(k));

        const children = allAccounts.filter(a =>
          a.parent_account_id === catAcct.id &&
          (showAll || a.is_active !== false) &&
          (!search || matchesDeep(a))
        );

        if (search && !children.length &&
            !catAcct.code.includes(search) && !catAcct.name.toLowerCase().includes(search)) return '';

        // Render an account and, beneath it, its own sub-accounts. Depth is
        // capped at three levels in total (category, sub, sub-sub) so the
        // indentation stays readable.
        const renderAccount = (a, depth) => {
          const indent = 20 * depth;
          const kids = depth < 2
            ? allAccounts.filter(k =>
                k.parent_account_id === a.id &&
                (showAll || k.is_active !== false))
            : [];
          return `
            <div class="coa-row ${a.is_active === false ? 'coa-inactive' : ''}">
              <div style="font-family:var(--font-mono);font-size:12px;color:var(--color-muted);padding-left:${indent}px">${a.code}</div>
              <div class="coa-name" style="padding-left:${indent}px">${a.name}</div>
              <div style="font-size:12px;color:var(--color-muted)">${a.account_type}</div>
              <div style="font-size:12px;color:var(--color-muted)">${a.normal_balance||''}</div>
              <div style="display:flex;gap:4px">
                <button class="btn" style="padding:2px 8px;font-size:11px" onclick="openDrawer('${a.id}')">Edit</button>
                ${depth < 2 ? `<button class="btn" style="padding:2px 8px;font-size:11px" title="Add sub-account" onclick="openDrawer(null,'${a.id}')">+</button>` : ''}
                <button class="btn" style="padding:2px 8px;font-size:11px;background:${a.is_active===false?'var(--color-success)':'var(--color-muted)'}"
                  onclick="toggleActive('${a.id}',${a.is_active===false})">
                  ${a.is_active === false ? 'Activate' : 'Deactivate'}
                </button>
              </div>
            </div>
            ${kids.map(k => renderAccount(k, depth + 1)).join('')}`;
        };

        const rows = children.length
          ? children.map(a => renderAccount(a, 1)).join('')
          : `<div class="coa-row"><div style="color:var(--color-muted);grid-column:1/-1;padding-left:20px">No sub-accounts yet.</div></div>`;

        return `
          <div class="coa-row" style="background:var(--color-bg, #F7F6F3)">
            <div style="font-family:var(--font-mono);font-size:12px;font-weight:700">${cat.code}</div>
            <div style="font-weight:700">${cat.label}
              <span style="font-weight:400;color:var(--color-muted);font-size:12px">(${children.length} account${children.length!==1?'s':''})</span>
            </div>
            <div style="font-size:12px;color:var(--color-muted)">${cat.type}</div>
            <div></div>
            <div><button class="btn" style="padding:2px 8px;font-size:11px" onclick="openDrawer(null,'${catAcct.id}')">+ Add sub-account</button></div>
          </div>
          ${rows}`;
      }).join('');

      container.innerHTML = `
        <div class="coa-row coa-hdr">
          <div>Code</div><div>Name</div><div>Type</div><div>Balance</div><div>Actions</div>
        </div>
        ${sections}`;
    }

    function openDrawer(id, presetParentId) {
      editingId = id;
      document.getElementById('drawer-error').style.display = 'none';
      document.getElementById('drawer-title').textContent = id ? 'Edit account' : 'Add account';
      document.getElementById('d-active-wrap').style.display = id ? 'block' : 'none';
      if (id) {
        const a = allAccounts.find(x => x.id === id);
        if (!a) return;
        document.getElementById('d-code').value = a.code;
        document.getElementById('d-name').value = a.name;
        document.getElementById('d-type').value = a.account_type;
        document.getElementById('d-normal').value = a.normal_balance || 'debit';
        document.getElementById('d-desc').value = a.description || '';
        document.getElementById('d-active').checked = a.is_active !== false;
        document.getElementById('d-parent').value = a.parent_account_id || '';
        document.getElementById('d-rental').checked = a.in_rental_schedule === true;
      } else {
        ['d-code','d-name','d-desc'].forEach(i => document.getElementById(i).value = '');
        document.getElementById('d-rental').checked = false;
        // Shown for clarity only: the database applies the parent's setting
        // to any new sub-account regardless of what is ticked here.
        if (presetParentId) {
          const parent = allAccounts.find(a => a.id === presetParentId);
          document.getElementById('d-rental').checked = parent ? parent.in_rental_schedule === true : false;
          document.getElementById('d-parent').value = presetParentId;
          autoSetType();
        }
      }
      document.getElementById('backdrop').classList.add('open');
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('backdrop').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
      editingId = null;
    }

    function autoSetType() {
      const pid = document.getElementById('d-parent').value;
      if (!pid) return;
      const p = allAccounts.find(a => a.id === pid);
      if (!p) return;
      document.getElementById('d-type').value = p.account_type;
      document.getElementById('d-normal').value = p.normal_balance || 'debit';

      // Suggest the next available code under this category, but only
      // when creating a new account — never overwrite an existing one's code.
      if (!editingId) {
        document.getElementById('d-code').value = suggestNextCode(pid);
      }
    }

    function suggestNextCode(parentId) {
      const parent = allAccounts.find(a => a.id === parentId);
      if (!parent) return '';
      const parentBase = parseInt(parent.code, 10);
      if (isNaN(parentBase)) return '';

      const siblings = allAccounts.filter(a => a.parent_account_id === parentId);
      if (!siblings.length) return String(parentBase + 10);

      const maxSiblingCode = Math.max(...siblings.map(a => parseInt(a.code, 10) || parentBase));
      return String(maxSiblingCode + 10);
    }

    async function saveAccount() {
      const errorEl = document.getElementById('drawer-error');
      errorEl.style.display = 'none';
      const code = document.getElementById('d-code').value.trim();
      const name = document.getElementById('d-name').value.trim();
      if (!code || !name) { showError(errorEl, 'Code and name are required.'); return; }

      // An account cannot sit under itself or under one of its own
      // descendants, which would create a loop the tree could not render.
      const chosenParent = document.getElementById('d-parent').value || null;
      if (editingId && chosenParent) {
        const isDescendant = (candidate, ancestorId) => {
          if (!candidate) return false;
          if (candidate.id === ancestorId) return true;
          const p = allAccounts.find(a => a.id === candidate.parent_account_id);
          return isDescendant(p, ancestorId);
        };
        const parentAcct = allAccounts.find(a => a.id === chosenParent);
        if (isDescendant(parentAcct, editingId)) {
          showError(errorEl, 'An account cannot sit under itself or one of its own sub-accounts.');
          return;
        }
      }

      const payload = {
        organisation_id: orgId, code, name,
        account_type: document.getElementById('d-type').value,
        normal_balance: document.getElementById('d-normal').value,
        description: document.getElementById('d-desc').value || null,
        parent_account_id: document.getElementById('d-parent').value || null,
        in_rental_schedule: document.getElementById('d-rental').checked,
        is_active: editingId ? document.getElementById('d-active').checked : true,
        is_control: false,
      };
      let error;
      if (editingId) {
        ({ error } = await supabaseClient.from('chart_of_accounts').update(payload).eq('id', editingId));
      } else {
        ({ error } = await supabaseClient.from('chart_of_accounts').insert(payload));
      }
      if (error) { showError(errorEl, error.message); return; }
      closeDrawer(); loadAccounts();
    }

    async function toggleActive(id, makeActive) {
      if (!makeActive) {
        const { count } = await supabaseClient.from('journal_lines')
          .select('*', { count: 'exact', head: true }).eq('account_id', id);
        if (count > 0 && !confirm(`This account has ${count} posted transaction(s). Deactivating prevents future use but preserves history. Continue?`)) return;
      }
      const { error } = await supabaseClient.from('chart_of_accounts').update({ is_active: makeActive }).eq('id', id);
      if (error) { alert(error.message); return; }
      loadAccounts();
    }

    (async () => {
      const session = await requireSession(); if (!session) return;
      const org = await currentOrg(); if (!org) return;
      orgId = org.organisation_id;
      loadAccounts();
    })();
  </script>

</body>
</html>
