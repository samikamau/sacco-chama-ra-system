        <h1 style="margin-bottom:4px">Request a demo</h1>
        <p style="color:var(--color-muted);font-size:13px;margin-bottom:16px">
          Tell us a little about your organisation and we will get in touch to set you up.
        </p>

        <div class="field"><label>Full name *</label><input id="d-name" placeholder="e.g. Jane Wanjiru"></div>
        <div class="field"><label>Email address *</label><input id="d-email" type="email" placeholder="you@example.com"></div>
        <div class="field"><label>Contact number *</label><input id="d-phone" type="tel" placeholder="e.g. 0722 908232"></div>
        <div class="field"><label>Organisation name *</label><input id="d-org" placeholder="e.g. Amani Chama Group"></div>

        <div class="field"><label>Organisation type *</label>
          <select id="d-type">
            <option value="">Select one</option>
            <option value="sacco">SACCO</option>
            <option value="chama">Chama</option>
            <option value="residents_association">Residents Association</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field"><label>Approximate number of members *</label>
          <select id="d-members">
            <option value="">Select a range</option>
            <option value="1-25">1 to 25</option>
            <option value="26-50">26 to 50</option>
            <option value="51-100">51 to 100</option>
            <option value="101-250">101 to 250</option>
            <option value="251-500">251 to 500</option>
            <option value="500+">More than 500</option>
          </select>
        </div>

        <div class="field"><label>Your position *</label>
          <select id="d-position">
            <option value="">Select one</option>
            <option value="Chairperson">Chairperson</option>
            <option value="Treasurer">Treasurer</option>
            <option value="Secretary">Secretary</option>
            <option value="Committee Member">Committee Member</option>
            <option value="Accountant">Accountant</option>
            <option value="Manager">Manager</option>
            <option value="Member">Member</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field"><label>Anything else? (optional)</label><input id="d-message" placeholder="Tell us what you are looking for"></div>

        <button class="btn accent" style="width:100%" onclick="submitRequest()">Submit request</button>
        <p id="error" class="error" style="display:none"></p>

        <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--color-muted)">
          Already have an account? <a href="/ledgers/login.html">Sign in</a>
        </p>
      </div>

      <div id="thanks-area" style="display:none;text-align:center;padding:20px 0">
        <div style="font-size:42px;margin-bottom:10px">&#10003;</div>
        <h1 style="margin-bottom:10px">Thank you</h1>
        <p style="color:var(--color-muted)">
          Your request has been received. We will get back to you soonest on the
          contact details you provided.
        </p>
        <a class="btn" style="margin-top:18px;display:inline-block" href="/ledgers/login.html">Back to sign in</a>
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    function showError(el, message) { el.textContent = message; el.style.display = "block"; }

    async function submitRequest() {
      const errorEl = document.getElementById("error");
      errorEl.style.display = "none";

      const payload = {
        full_name: document.getElementById("d-name").value.trim(),
        email: document.getElementById("d-email").value.trim(),
        phone: document.getElementById("d-phone").value.trim(),
        organisation_name: document.getElementById("d-org").value.trim(),
        org_type: document.getElementById("d-type").value,
        member_range: document.getElementById("d-members").value,
        contact_position: document.getElementById("d-position").value,
        message: document.getElementById("d-message").value.trim() || null,
      };

      if (!payload.full_name) { showError(errorEl, "Full name is required."); return; }
      if (!payload.email || !payload.email.includes("@")) { showError(errorEl, "A valid email address is required."); return; }
      if (!payload.phone) { showError(errorEl, "Contact number is required."); return; }
      if (!payload.organisation_name) { showError(errorEl, "Organisation name is required."); return; }
      if (!payload.org_type) { showError(errorEl, "Select your organisation type."); return; }
      if (!payload.member_range) { showError(errorEl, "Select an approximate number of members."); return; }
      if (!payload.contact_position) { showError(errorEl, "Select your position."); return; }

      const btn = document.querySelector("#form-area .btn.accent");
      btn.disabled = true;
      btn.textContent = "Submitting...";

      const { error } = await supabaseClient.from("demo_requests").insert(payload);

      if (error) {
        btn.disabled = false;
        btn.textContent = "Submit request";
        showError(errorEl, error.message);
        return;
      }

      document.getElementById("form-area").style.display = "none";
      document.getElementById("thanks-area").style.display = "block";
    }
  </script>
