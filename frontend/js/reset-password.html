<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set Your Password - Financial Operating System</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-shell">
    <div class="card login-card">
      <h1 id="page-title">Set your password</h1>
      <p id="intro" style="color:var(--color-muted);font-size:13px;margin-bottom:12px">
        Choose a password for your account.
      </p>

      <div id="form-area">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" autocomplete="new-password">
        </div>
        <button class="btn" style="width:100%" onclick="setPassword()">Save password</button>
        <p id="error" class="error" style="display:none"></p>
        <p id="success" style="display:none;color:var(--color-success)"></p>
      </div>

      <div id="invalid-link" style="display:none">
        <p class="error">This link is invalid or has expired. Request a new one from the sign-in page.</p>
        <a class="btn" style="width:100%;display:block;text-align:center;margin-top:12px" href="login.html">Back to sign in</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function setPassword() {
      const errorEl = document.getElementById("error");
      const successEl = document.getElementById("success");
      errorEl.style.display = "none"; successEl.style.display = "none";

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (!password || password.length < 8) {
        showError(errorEl, "Password must be at least 8 characters.");
        return;
      }
      if (password !== confirm) {
        showError(errorEl, "Passwords do not match.");
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) { showError(errorEl, error.message); return; }

      successEl.textContent = "Password saved. Redirecting to sign in...";
      successEl.style.display = "block";
      document.getElementById("form-area").querySelectorAll("input, button").forEach(el => el.disabled = true);

      // Record that this specific link has been consumed, so returning to
      // it shows "expired" rather than silently letting someone back in.
      try { localStorage.setItem(usedKey(), "1"); } catch (e) { /* non-critical */ }

      // Sign out so the recovery session cannot be used as a login. The
      // link's only job is setting a password; the user then signs in
      // normally with it.
      await supabaseClient.auth.signOut();
      setTimeout(() => { window.location.href = "login.html"; }, 1400);
    }

    // A key unique to this particular recovery token, so one used link
    // does not mark a later, legitimately new link as used.
    function usedKey() {
      const hash = window.location.hash || "";
      const match = hash.match(/access_token=([^&]+)/);
      const token = match ? match[1].slice(-32) : "none";
      return "pwreset_used_" + token;
    }

    function showExpired(msg) {
      document.getElementById("form-area").style.display = "none";
      document.getElementById("intro").style.display = "none";
      document.getElementById("page-title").textContent = "Link expired";
      const box = document.getElementById("invalid-link");
      if (msg) box.querySelector(".error").textContent = msg;
      box.style.display = "block";
    }

    (async () => {
      // If this exact link was already used to set a password, refuse it
      // even though a session may still exist in the browser.
      try {
        if (localStorage.getItem(usedKey()) === "1") {
          showExpired("This link has already been used. Request a new one from the sign-in page.");
          return;
        }
      } catch (e) { /* if storage is unavailable, fall through to the session check */ }

      // A recovery/invite link puts the session token in the URL's hash
      // fragment (#access_token=...&type=recovery or type=invite).
      // supabase-js picks this up automatically on load and establishes
      // a session from it - we just need to confirm one actually exists
      // before showing the form, otherwise someone landing here with no
      // token at all would see a form that can never succeed.
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        showExpired("This link is invalid or has expired. Request a new one from the sign-in page.");
        return;
      }
    })();
  </script>

</body>
</html>
