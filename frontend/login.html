<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in - Financial Operating System</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-shell">
    <div class="card login-card">
      <h1>Sign in</h1>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <button class="btn" style="width:100%" onclick="login()">Sign in</button>
      <p style="text-align:center;margin-top:10px">
        <a href="#" onclick="forgotPassword(event)" style="font-size:13px;color:var(--color-muted)">Forgot password?</a>
      </p>
      <p id="error" class="error" style="display:none"></p>
      <p id="info" style="display:none;color:var(--color-success);font-size:13px"></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/recovery-guard.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        showError(errorEl, error.message);
        return;
      }
      window.location.href = "index.html";
    }

    async function forgotPassword(e) {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      const infoEl = document.getElementById("info");
      errorEl.style.display = "none"; infoEl.style.display = "none";

      const email = document.getElementById("email").value.trim();
      if (!email) { showError(errorEl, "Enter your email address above first."); return; }

      const redirectTo = window.location.origin + window.location.pathname.replace(/login\.html$/, "reset-password.html");
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) { showError(errorEl, error.message); return; }

      infoEl.textContent = "Check your email for a link to reset your password.";
      infoEl.style.display = "block";
    }

    (async () => {
      // Recovery and invite links must never sign someone straight in.
      // handleRecoveryRedirect checks every link format Supabase uses
      // (hash access_token, query token_hash, and PKCE code) and sends
      // the user to the password page instead.
      if (await handleRecoveryRedirect()) return;

      // Otherwise, if already signed in, skip straight to the dashboard.
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = "index.html";
    })();
  </script>
</body>
</html>
