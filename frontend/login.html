<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — Financial Operating System</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-shell">
    <div class="card login-card">
      <h1>Sign in</h1>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <button class="btn" style="width:100%" onclick="login()">Sign in</button>
      <p style="text-align:center;margin-top:10px">
        <a href="#" onclick="forgotPassword(event)" style="font-size:13px;color:var(--color-muted)">Forgot password?</a>
      </p>
      <p id="error" class="error" style="display:none"></p>
      <p id="info" style="display:none;color:var(--color-success);font-size:13px"></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        showError(errorEl, error.message);
        return;
      }
      window.location.href = "index.html";
    }

    async function forgotPassword(e) {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      const infoEl = document.getElementById("info");
      errorEl.style.display = "none"; infoEl.style.display = "none";

      const email = document.getElementById("email").value.trim();
      if (!email) { showError(errorEl, "Enter your email address above first."); return; }

      const redirectTo = window.location.origin + window.location.pathname.replace(/login\.html$/, "reset-password.html");
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) { showError(errorEl, error.message); return; }

      infoEl.textContent = "Check your email for a link to reset your password.";
      infoEl.style.display = "block";
    }

    (async () => {
      // A recovery or invite link lands here with the session token in the
      // URL's hash fragment. This page's Supabase client auto-exchanges it
      // for a session as soon as it initializes. That token is single-use,
      // so we must NOT pass the hash on to another page (its own client
      // would try to exchange the same already-used token again and fail).
      // Instead: wait for this page's exchange to finish and persist the
      // session, then hand off to the password page with no hash at all —
      // it picks up the already-saved session on its own.
      const hash = window.location.hash || "";
      if (hash.includes("type=recovery") || hash.includes("type=invite")) {
        await supabaseClient.auth.getSession();
        window.location.replace("reset-password.html");
        return;
      }

      // Otherwise, if already signed in, skip straight to the dashboard.
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = "index.html";
    })();
  </script>
</body>
</html>
