<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password - Edhafu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Inter, -apple-system, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #123C36; padding: 24px;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 46px);
  }
  .card {
    background: #fff; border-radius: 18px; padding: 48px 40px; width: 100%; max-width: 440px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.28);
  }
  h1 { text-align: center; font-size: 24px; margin: 0 0 32px; color: #17202A; }
  label { display: block; font-size: 14px; font-weight: 600; color: #123C36; margin-bottom: 6px; }
  .field { margin-bottom: 6px; }
  .input-wrap { position: relative; }
  input {
    width: 100%; padding: 13px 42px 13px 14px; border-radius: 8px;
    border: 1px solid #E5E7EB; background: #F7F7F5; font-size: 14px; color: #17202A;
  }
  input:focus { outline: none; border-color: #123C36; background: #fff; }
  .toggle-eye {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: #8B98AC; padding: 4px;
  }
  .helper { font-size: 12.5px; color: #8B98AC; margin: 6px 0 20px; }
  .helper.error { color: #D8394C; }
  .helper.ok { color: #10B981; }
  .btn-main {
    width: 100%; background: #123C36; color: #fff; border: none; border-radius: 8px;
    padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
  }
  .btn-main:hover { background: #0D2E29; }
  .btn-main:disabled { opacity: 0.6; cursor: default; }
  .success-box, .expired-box { display: none; text-align: center; }
  .success-box .tick, .expired-box .mark { font-size: 40px; margin-bottom: 12px; }
  .expired-box .mark { color: #D8394C; }
  .success-box .tick { color: #10B981; }
  .success-box p, .expired-box p { color: #5B6672; font-size: 14px; }
  .expired-box a {
    display: inline-block; margin-top: 16px; color: #fff; background: #123C36;
    padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">

    <div id="form-area">
      <h1>Change password</h1>

      <div class="field">
        <label for="password">New Password</label>
        <div class="input-wrap">
          <input id="password" type="password" autocomplete="new-password" oninput="checkPasswordStrength()">
          <button type="button" class="toggle-eye" onclick="toggleVisibility('password',this)">&#128065;</button>
        </div>
      </div>
      <p class="helper" id="password-helper">Must be at least 8 characters.</p>

      <div class="field">
        <label for="confirm">Confirm Password</label>
        <div class="input-wrap">
          <input id="confirm" type="password" autocomplete="new-password" oninput="checkPasswordStrength()">
          <button type="button" class="toggle-eye" onclick="toggleVisibility('confirm',this)">&#128065;</button>
        </div>
      </div>
      <p class="helper" id="confirm-helper">Re-enter the same password.</p>

      <button class="btn-main" id="submit-btn" onclick="setPassword()">Change Password</button>
    </div>

    <div class="success-box" id="success-box">
      <div class="tick">&#10003;</div>
      <h1 style="margin-bottom:8px">Password changed</h1>
      <p>Your password has been updated. Redirecting you to sign in...</p>
    </div>

    <div class="expired-box" id="expired-box">
      <div class="mark">&#10007;</div>
      <h1 id="expired-title" style="margin-bottom:8px">Link expired</h1>
      <p id="expired-message">This link is invalid or has expired. Request a new one from the sign-in page.</p>
      <a href="login.html">Back to sign in</a>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/recovery-guard.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function toggleVisibility(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
    }

    function checkPasswordStrength() {
      const pw = document.getElementById("password").value;
      const cf = document.getElementById("confirm").value;
      const pwHelper = document.getElementById("password-helper");
      const cfHelper = document.getElementById("confirm-helper");

      if (!pw) {
        pwHelper.textContent = "Must be at least 8 characters.";
        pwHelper.className = "helper";
      } else if (pw.length < 8) {
        pwHelper.textContent = "Please enter a valid password in the required field.";
        pwHelper.className = "helper error";
      } else {
        pwHelper.textContent = "Looks good.";
        pwHelper.className = "helper ok";
      }

      if (!cf) {
        cfHelper.textContent = "Re-enter the same password.";
        cfHelper.className = "helper";
      } else if (cf !== pw) {
        cfHelper.textContent = "Passwords do not match.";
        cfHelper.className = "helper error";
      } else {
        cfHelper.textContent = "Passwords match.";
        cfHelper.className = "helper ok";
      }
    }

    async function setPassword() {
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const pwHelper = document.getElementById("password-helper");
      const cfHelper = document.getElementById("confirm-helper");

      if (!password || password.length < 8) {
        pwHelper.textContent = "Please enter a valid password in the required field.";
        pwHelper.className = "helper error";
        return;
      }
      if (password !== confirm) {
        cfHelper.textContent = "Passwords do not match.";
        cfHelper.className = "helper error";
        return;
      }

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Saving...";

      const { data: userData, error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        pwHelper.textContent = error.message;
        pwHelper.className = "helper error";
        btn.disabled = false;
        btn.textContent = "Change Password";
        return;
      }

      // Send the "Password Reset Successful" confirmation email. Fire
      // this before signing out (the function call needs an active
      // session) but never let a failure here block the actual reset,
      // which has already succeeded.
      try {
        const email = userData && userData.user ? userData.user.email : null;
        const name = userData && userData.user ? userData.user.user_metadata?.full_name : null;
        if (email) {
          await supabaseClient.functions.invoke("send-password-changed-email", {
            body: { email, name },
          });
        }
      } catch (e) { /* the password was still changed successfully */ }

      // Record that this specific link has been consumed, so returning to
      // it shows "expired" rather than silently letting someone back in.
      markRecoveryLinkUsed(getRecoveryContext().token);

      // Sign out so the recovery session cannot be used as a login. The
      // link's only job is setting a password; the user then signs in
      // normally with it.
      await supabaseClient.auth.signOut();

      document.getElementById("form-area").style.display = "none";
      document.getElementById("success-box").style.display = "block";
      setTimeout(() => { window.location.href = "login.html"; }, 1600);
    }

    function showExpired(msg) {
      document.getElementById("form-area").style.display = "none";
      document.getElementById("expired-message").textContent = msg;
      document.getElementById("expired-box").style.display = "block";
    }

    (async () => {
      const ctx = getRecoveryContext();

      // If this exact link was already used to set a password, refuse it
      // even though a session may still exist in the browser.
      if (isRecoveryLinkUsed(ctx.token)) {
        try { await supabaseClient.auth.signOut(); } catch (e) {}
        showExpired("This link has already been used. Request a new one from the sign-in page.");
        return;
      }

      // Newer Supabase links carry ?token_hash=...&type=recovery or a PKCE
      // ?code=... rather than an already-exchanged session in the hash.
      // Exchange those explicitly; the older hash format is picked up
      // automatically by supabase-js on load.
      const params = new URLSearchParams(window.location.search);
      const tokenHash = params.get("token_hash");
      const code = params.get("code");
      const linkType = params.get("type");

      if (tokenHash && linkType) {
        const { error } = await supabaseClient.auth.verifyOtp({
          token_hash: tokenHash, type: linkType,
        });
        if (error) { showExpired("This link is invalid or has expired. Request a new one from the sign-in page."); return; }
      } else if (code) {
        const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
        if (error) { showExpired("This link is invalid or has expired. Request a new one from the sign-in page."); return; }
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        showExpired("This link is invalid or has expired. Request a new one from the sign-in page.");
        return;
      }
    })();
  </script>

</body>
</html>
