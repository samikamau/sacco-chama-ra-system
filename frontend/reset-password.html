<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edhafu - Set new password</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/edhafu-icon-32.png">
<link rel="apple-touch-icon" href="images/edhafu-icon-180.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: var(--color-bg); }
  .auth-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .auth-card {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    padding: 40px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
  }
  .auth-brand {
    color: var(--color-primary);
    margin-bottom: 4px;
    text-align: center;
  }
  .auth-tagline {
    font-size: 13px;
    color: var(--color-muted);
    text-align: center;
    margin-bottom: 28px;
  }
  .auth-tabs {
    display: flex;
    border-bottom: 2px solid var(--color-line);
    margin-bottom: 24px;
  }
  .auth-tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--color-muted);
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: color 0.15s;
  }
  .auth-tab.active {
    color: var(--color-ink);
    border-bottom-color: var(--color-accent);
    font-weight: 700;
  }
  .check-label {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
    color: var(--color-muted);
    cursor: pointer;
    margin-top: 4px;
  }
  .check-label input { margin-top: 2px; flex-shrink: 0; }
  .divider { border:none; border-top:1px solid var(--color-line); margin: 16px 0; }
</style>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand"><img class="edhafu-logo" src="images/edhafu-logo-dark.png" alt="Edhafu"></div>
    <div class="auth-tagline">Set a new password</div>

    <p id="rp-checking" style="font-size:14px;color:var(--color-muted)">Checking your reset link...</p>

    <div id="rp-invalid" style="display:none">
      <p class="error" style="display:block">This reset link is invalid or has expired.</p>
      <p style="font-size:14px;margin-top:12px">Go back to sign in and click <strong>Forgot password?</strong> to request a new link.</p>
      <a href="login.html" class="btn accent" style="display:block;text-align:center;margin-top:16px;text-decoration:none">Back to sign in</a>
    </div>

    <div id="rp-form" style="display:none">
      <p style="font-size:14px;margin-bottom:12px">Resetting password for <strong id="rp-email"></strong></p>
      <div class="field"><label>New password *</label>
        <input id="rp-password" type="password" autocomplete="new-password" placeholder="Min. 8 characters"></div>
      <div class="field"><label>Confirm new password *</label>
        <input id="rp-confirm" type="password" autocomplete="new-password"></div>
      <button id="rp-btn" class="btn accent" style="width:100%;margin-top:4px" onclick="savePassword()">Save new password</button>
      <p id="rp-error" class="error" style="display:none"></p>
    </div>

    <div id="rp-done" style="display:none">
      <p style="color:var(--color-success);font-size:14px">Your password has been updated.</p>
      <a href="login.html" class="btn accent" style="display:block;text-align:center;margin-top:16px;text-decoration:none">Sign in with new password</a>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  let ready = false;

  function show(id) {
    ['rp-checking','rp-invalid','rp-form','rp-done'].forEach(x =>
      document.getElementById(x).style.display = x === id ? 'block' : 'none');
  }

  function showForm(session) {
    if (ready || !session) return;
    ready = true;
    document.getElementById('rp-email').textContent = session.user.email;
    show('rp-form');
  }

  // Supabase reads the token from the link and fires PASSWORD_RECOVERY
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) showForm(session);
  });

  (async () => {
    // Newer link format (?code=...)
    const code = new URLSearchParams(window.location.search).get('code');
    if (code) {
      const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
      if (!error && data.session) { showForm(data.session); return; }
    }
    // Error in the link itself (e.g. expired)
    if (window.location.hash.includes('error')) { show('rp-invalid'); return; }
    // Give Supabase a moment to process the link, then check
    setTimeout(async () => {
      if (ready) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) showForm(session); else show('rp-invalid');
    }, 1500);
  })();

  async function savePassword() {
    const errorEl = document.getElementById('rp-error');
    errorEl.style.display = 'none';
    const pw = document.getElementById('rp-password').value;
    const confirm = document.getElementById('rp-confirm').value;
    if (!pw || pw.length < 8) { showError(errorEl, 'Password must be at least 8 characters.'); return; }
    if (pw !== confirm) { showError(errorEl, 'Passwords do not match.'); return; }

    const btn = document.getElementById('rp-btn');
    btn.disabled = true; btn.textContent = 'Saving...';
    const { error } = await supabaseClient.auth.updateUser({ password: pw });
    btn.disabled = false; btn.textContent = 'Save new password';
    if (error) { showError(errorEl, error.message); return; }

    // Sign out so they log in fresh with the new password
    localStorage.removeItem('active_org_id');
    sessionStorage.clear();
    await supabaseClient.auth.signOut();
    history.replaceState(null, '', 'reset-password.html');
    show('rp-done');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('rp-form').style.display === 'block') savePassword();
  });
</script>
</body>
</html>
